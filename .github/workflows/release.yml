name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-22.04
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      # 私有插件（登录等敏感功能）：从仓库 Secret PLUGINS_B64 还原，
      # secret 不存在时自动构建纯核心版本。生成方式见 PLUGIN_DEV.md。
      - name: Restore private plugins
        shell: pwsh
        env:
          PLUGINS_B64: ${{ secrets.PLUGINS_B64 }}
        run: |
          if ($env:PLUGINS_B64) {
            New-Item -ItemType Directory -Force -Path src/plugins | Out-Null
            [IO.File]::WriteAllBytes("$env:RUNNER_TEMP/plugins.zip", [Convert]::FromBase64String($env:PLUGINS_B64.Trim()))
            Expand-Archive "$env:RUNNER_TEMP/plugins.zip" -DestinationPath src/plugins -Force
            Write-Host "plugins restored: $((Get-ChildItem src/plugins -Directory).Name -join ', ')"
          } else {
            Write-Host "no PLUGINS_B64 secret, building core-only"
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2

      - name: Install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm ci

      # Release 说明取自 CHANGELOG.md 对应版本条目，避免每次发版手写
      - name: Extract release notes
        id: notes
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $lines = Get-Content CHANGELOG.md
          $start = -1
          $end = $lines.Count
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($start -lt 0 -and $lines[$i] -match "^## \[$([regex]::Escape($version))\]") { $start = $i; continue }
            if ($start -ge 0 -and $lines[$i] -match '^## \[') { $end = $i; break }
          }
          if ($start -ge 0 -and $end -gt $start) {
            $body = ($lines[($start + 1)..($end - 1)] -join "`n").Trim()
          } else {
            $body = 'See the assets below to download and install this version.'
          }
          "body<<EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $body | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "EOF" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'tsrbox v__VERSION__'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      # 绿色版：Windows 单文件 zip，追加到同一 Release
      - name: Create portable zip (windows only)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          Compress-Archive -Path src-tauri/target/release/tsrbox.exe -DestinationPath "tsrbox_${{ github.ref_name }}_x64-portable.zip" -Force

      - name: Upload portable zip (windows only)
        if: matrix.platform == 'windows-latest'
        uses: softprops/action-gh-release@v2
        with:
          files: "tsrbox_${{ github.ref_name }}_x64-portable.zip"
